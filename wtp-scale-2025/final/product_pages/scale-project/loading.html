<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading page</title>
    <link rel="stylesheet" href="resources/css/index.css" />
  </head>
  <body>
    <div class="preloader blue-background" id="preloader"></div>
    <div class="main-container blue-background">
      <div class="logo-container">
        <img src="./resources/img/logo-orange2.svg" alt="Logo" class="logo" />
      </div>
      <div class="loading-page-content-container">
        <div class="loading-items">
          <div class="loading-item">
            <span class="loading-icon" id="icon-1"></span>
            <p>Taking the product apart</p>
          </div>
          <div class="loading-item">
            <span class="loading-icon" id="icon-2"></span>
            <p>Checking components</p>
          </div>
          <div class="loading-item">
            <span class="loading-icon" id="icon-3"></span>
            <p>Calling 10.000 sources</p>
          </div>
          <div class="loading-item">
            <span class="loading-icon" id="icon-4"></span>
            <p>Reading financial reports</p>
          </div>
          <div class="loading-item">
            <span class="loading-icon" id="icon-5"></span>
            <p>Calculating prices</p>
          </div>
        </div>
        <div class="loading-page-video-container">
          <video
            src="./resources/video/loading.mp4"
            autoplay
            loop 
            muted
            class="loading-page-video"
          ></video>
        </div>
      </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const video = document.querySelector("video");
        const preloader = document.getElementById("preloader");

        video.addEventListener("canplaythrough", function () {
          preloader.classList.add("hidden");
          document.body.classList.add("loaded");
        });

        const icons = document.querySelectorAll(".loading-icon");
        icons.forEach((icon, index) => {
          setTimeout(() => {
            icon.classList.remove("loading-icon");
            icon.classList.add("checkmark");
          }, (index + 1) * 2000);
        });
      });
    </script>
  </body>
</html>
