<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro page</title>
    <link rel="stylesheet" href="resources/css/index.css" />
  </head>
  <body>
    <div class="preloader blue-background" id="preloader"></div>
    <div class="main-container blue-background">
      <div class="logo-container">
        <img src="./resources/img/logo-orange2.svg" alt="Logo" class="logo" />
      </div>
      <div class="intro-page-content-container">
        <div class="intro-page-title-container">
          <h1>What's the price?</h1>
          <h2>Try our price calculations</h2>
        </div>
        <div class="intro-page-video-container">
          <video class="portrait-video" autoplay muted loop>
            <!--the video source for intro video goes here -->
            <source src="./resources/video/intro.mp4" type="video/mp4" />
          </video>
        </div>
        <div class="intro-page-images-container">
          <img
            src="./resources/img/triple-chevron-down.svg"
            alt="Image 1"
            class="intro-image"
          />
          <img
            src="./resources/img/scale.gif"
            alt="Image 2"
            class="intro-image"
          />
          <p>Place a product on the scale</p>
          <img
            src="./resources/img/single-chevron-down.svg"
            alt="Image 3"
            class="intro-image"
          />
        </div>
      </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const video = document.querySelector("video");
        const preloader = document.getElementById("preloader");

        video.addEventListener("canplaythrough", function () {
          preloader.classList.add("hidden");
          document.body.classList.add("loaded");
        });
      });
    </script>
  </body>
</html>
